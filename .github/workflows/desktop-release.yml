# The desktop program's release (docs/desktop-program-plan.md §10, §14 step 5; ADR-0069).
#
# On a tag `desktop-v<version>` matching desktop/src-tauri/tauri.conf.json: the program built on its
# own runner for each target, each an installer plus the updater's artifact with its signature,
# attached to one GitHub release as a draft with the latest.json the updater reads
# (https://github.com/mossglenn/armature/releases/latest/download/latest.json, tauri.conf.json's
# plugins.updater). The release is published by hand once the installers have been tried; a draft is
# invisible to the updater, so nothing reaches an installed program until then.
#
#   macOS, Apple silicon   .dmg and .app, aarch64-apple-darwin
#   macOS, Intel           .dmg and .app, x86_64-apple-darwin, cross-built on the same runner; one
#                          per architecture, not universal, since a universal build carries two copies
#                          of Node (plan §10); prepare.mjs takes Node for the build's target from
#                          TAURI_ENV_TARGET_TRIPLE
#   Windows x64            the NSIS installer, per user, no administrator needed
#   Linux x64              the AppImage, which the updater replaces, and a .deb, which it does not;
#                          on Ubuntu 22.04 so the AppImage runs on the older glibc
#
# On a tag `desktop-rehearsal-<n>` (on a branch, before it merges: a tag runs the workflow file at its
# own commit, which running a workflow by hand cannot do until the file is on main), it builds the
# same into a draft of that name, for trying the installers and the release itself; delete the draft
# and the tag afterwards (gh release delete desktop-rehearsal-<n> --cleanup-tag). The version check
# then only asks the three files to agree.
#
# Signing (plan §15 question 12, decided 2026-11-05: the updater's signature only, until an audience
# beyond Amos and the rehearsal machines): the repository's secrets TAURI_SIGNING_PRIVATE_KEY (the
# private half of ~/.tauri/armature.key, whose public half is in tauri.conf.json) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. An update whose signature does not verify is never installed.
# macOS builds are signed ad hoc (signingIdentity "-"), which Apple silicon requires to open at all;
# Gatekeeper and SmartScreen warn on first install, and docs/desktop-program.md says how to proceed.
# An Apple Developer ID or a Windows certificate is a configuration change when it comes (the spike).
#
# The third-party actions are pinned to commits (the version beside each, the pins Quiver's release
# workflow uses), since a moving tag would let a compromised action read the signing key; GitHub's
# own actions stay on their major tags, as ci.yml has them.

name: Desktop release

on:
  push:
    tags: ['desktop-v*', 'desktop-rehearsal-*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A tag names the version the program says it is; the three files that carry it agree with it.
      - name: Check the version
        shell: bash
        run: |
          conf=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./desktop/package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          echo "tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$cargo" ]; then
            echo "::error::The program's version differs between tauri.conf.json, package.json and Cargo.toml"; exit 1
          fi
          case "$GITHUB_REF_NAME" in
            desktop-rehearsal-*) echo "TITLE=Armature desktop $conf, $GITHUB_REF_NAME" >> "$GITHUB_ENV" ;;
            "desktop-v$conf") echo "TITLE=Armature desktop $conf" >> "$GITHUB_ENV" ;;
            *) echo "::error::The tag $GITHUB_REF_NAME does not name the program's version, $conf (desktop-v$conf)"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-27
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      # Tauri's Linux prerequisites, as desktop.yml installs them.
      - name: Install the system's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file
      # Node for the sidecar, fetched by prepare.mjs (the build's beforeBuildCommand) for the target
      # and checked against nodejs.org's checksums.
      - uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: desktop-node-${{ matrix.target }}-${{ hashFiles('desktop/scripts/prepare.mjs') }}
      - name: Install the root's workspace (the core is bundled there)
        run: npm ci
      - name: Install the shell's packages
        run: npm ci
        working-directory: desktop

      # tauri.release.conf.json turns on the updater's artifacts, which need the signing key, so the
      # pull requests' debug builds (desktop.yml) build without it.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0, 2026-10-27
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ env.TITLE }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            The Armature desktop program: a workspace hub on your machine for your tools, connected to your instance. What it does, how to install it and what each message means: https://github.com/mossglenn/armature/blob/main/docs/desktop-program.md

            These builds are not signed by Apple or Microsoft yet. On macOS, the first time, right-click Armature in Applications and choose Open; on Windows, choose More info, then Run anyway. Updates are signed and checked before they install.
          releaseDraft: true
          prerelease: false
          # The updater on Windows installs the NSIS installer, the only Windows bundle built.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config ${{ github.workspace }}/desktop/src-tauri/tauri.release.conf.json
