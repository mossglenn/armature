# Armature CI (continuous integration)
#
# Three jobs, run in parallel on every push to main and every pull request:
#
#   app       Guards the contracts that need no store: `schema/schema.json` and the
#             generated `packages/types` agree (check:types), the app lints clean,
#             the app and the packages type-check (`tsc`; lint alone missed
#             an argument-count error once, 2026-10-20), and the standalone hub
#             and the operator tools bundle (`build:hub` and `build:operator`,
#             esbuild over app/server.ts and app/operator.ts; ADR-0062).
#
# The repository is an npm workspace (root package.json: app and packages/*), so
# one `npm ci` at the root installs the app and the packages it depends on.
# scripts/ is deliberately outside the workspace: the TerminusDB client stays
# resolvable from scripts/node_modules only (ADR-0055), so the contract job
# installs it separately.
#
#   contract  The contract suite (Phase 7 of docs/development-plan.md): starts
#             TerminusDB as a service container, waits for it, loads the schema,
#             seeds the demonstration course and runs `npm test` in app/, which
#             calls the Hono app in-process against that store and exercises every
#             /api/v1 route and every invariant, and serves it once over a socket
#             (lib/hub.test.ts). The Vitest global setup waits again for the seeded
#             database before the first test file starts.
#
#   images    Builds the hub's container image (docker/hub.Dockerfile) and checks
#             that it starts and answers GET /api/v1/discover, the one read that
#             needs no store; then builds the viewer's image (docker/viewer.Dockerfile)
#             and checks that it starts. What the hub answers over a socket is the
#             contract job's hub test; this job guards the images themselves,
#             including that the operator tools run inside the hub's image.
#
# Each job has a timeout, so a stalled install fails within minutes rather than
# after GitHub's six-hour default. Healthy runs take 20 to 95 seconds a job. On
# 2026-10-22, during npm's "Degraded Package Install and Publishing" incident, one
# run passed slowly (app 7 minutes, images 5, contract 11) and the next stalled in
# the contract job's `npm ci` until it was cancelled by hand. The limits let the
# slow run pass and stop the stalled one: 10 minutes for app and images, 15 for
# contract.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, type-check, generated-types drift check and hub bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:types
      - run: npm run build:hub --workspace app
      - run: npm run build:operator --workspace app

  contract:
    name: Contract suite against TerminusDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      terminusdb:
        # The same image and tag docker/docker-compose.yml pins.
        image: terminusdb/terminusdb-server:v12.0.7
        ports:
          - 6363:6363
        env:
          TERMINUSDB_ADMIN_PASS: admin
          TERMINUSDB_SERVER_NAME: localhost
    env:
      # What app/.env.local holds locally; the scripts read the same variables.
      TERMINUS_URL: http://localhost:6363
      TERMINUS_USER: admin
      TERMINUS_PASS: admin
      TERMINUS_DB: armature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/package-lock.json
      - name: Install the scripts' dependencies (the TerminusDB client)
        run: npm ci
        working-directory: scripts
      - name: Install the workspace (the app and the packages)
        run: npm ci
      - name: Wait for TerminusDB
        run: node scripts/wait_for_store.js
      - name: Load the schema
        run: node scripts/load_schema.js
      - name: Seed the demonstration course
        run: node scripts/seed_data.js
      - name: Run the contract suite
        run: npm test

  images:
    name: Hub and viewer container images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the hub image
        run: docker build -f docker/hub.Dockerfile -t armature-hub .
      - name: Start it and wait for GET /discover
        run: |
          docker run -d --name hub -p 3100:3100 armature-hub
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/v1/discover > /tmp/discover.json; then
              echo "answered after ${i}s"; cat /tmp/discover.json; exit 0
            fi
            sleep 1
          done
          echo "the hub did not answer within 30s"; docker logs hub; exit 1
      - name: Show the log and stop
        if: always()
        run: docker logs hub; docker rm -f hub
      - name: Run the operator tools inside the hub image
        run: docker run --rm armature-hub node operator.mjs --help
      - name: Build the viewer image
        run: docker build -f docker/viewer.Dockerfile -t armature-viewer .
      - name: Start it and wait for a page
        # With no hub to read, a page answers 500; the check is that the server
        # is up and routing, which any status below 500 or a 500 both show.
        run: |
          docker run -d --name viewer -p 3000:3000 armature-viewer
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ]; then echo "answered $code after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the viewer did not answer within 30s"; docker logs viewer; exit 1
      - name: Show the viewer log and stop
        if: always()
        run: docker logs viewer; docker rm -f viewer
