# Armature CI (continuous integration)
#
# Six jobs, run in parallel on every push to main and every pull request, after a
# seventh that decides whether five of them are needed:
#
#   changes   Lists the files the push or pull request changes and says whether any
#             could affect the five jobs that build, start or test the code (client,
#             contract, viewer, files, images). Only documents cannot: a path under
#             docs/, schema/docs/ or .claude/, or any *.md, except
#             docs/client-changes.md, which version.test.ts reads. A test that comes
#             to read another document makes that document code: add it beside
#             client-changes.md in the step below. Everything else, this file
#             included, is code. The step fails open: a diff it cannot take (a new
#             branch, a force-push, an error) counts as code, and so does a failure of
#             the job itself, so a skip happens only when every changed path is
#             proven a document. The app job always runs, since it checks the context
#             files' budgets. Added 2026-11-12, when 79 of 193 commits since
#             2026-11-01 changed documents only.
#
#   app       Guards the contracts that need no store: `schema/schema.json` and the
#             generated `packages/types` agree (check:types), the app lints clean,
#             the app and the packages type-check (`tsc`; lint alone missed
#             an argument-count error once, 2026-10-20), and the standalone hub,
#             the operator tools and the desktop program's core bundle
#             (`build:hub`, `build:operator` and `build:desktop`, esbuild over
#             app/server.ts, app/operator.ts and app/desktop.ts; ADR-0062,
#             ADR-0069).
#
# The desktop program's shell (desktop/, outside the workspace) has its own workflow,
# desktop.yml, run when the shell or the core it carries changes.
#
# The repository is an npm workspace (root package.json: app and packages/*), so
# one `npm ci` at the root installs the app and the packages it depends on.
# scripts/ is deliberately outside the workspace: the TerminusDB client stays
# resolvable from scripts/node_modules only (ADR-0055), so the contract job
# installs it separately.
#
#   contract  The contract suite (Phase 7 of docs/development-plan.md): starts
#             TerminusDB as a service container, waits for it, loads the schema,
#             seeds the demonstration course, checks the seed against every rule
#             with the operator's `check` (ADR-0062; the seed is written outside
#             the API, so nothing else would notice a seed that breaks a rule),
#             and runs `npm test` in app/, which
#             calls the Hono app in-process against that store and exercises every
#             /api/v1 route and every invariant, and serves it once over a socket
#             (lib/hub.test.ts). The Vitest global setup waits again for the seeded
#             database before the first test file starts. Split into three shards
#             (`vitest --shard=<n>/3`) since 2026-11-12, each on its own runner with
#             its own store, loaded, seeded and checked the same way: the files
#             still run one at a time against a store of their own (see
#             app/vitest.config.mts for why), and Vitest places every file in exactly
#             one shard, by the hash of its path. Run whole, the suite took 4.5 to 5
#             minutes of a 6-minute run; the shards measured 97, 69 and 120 seconds
#             of tests on 2026-11-12. `npm test -- --shard=2/3` in app/ runs one locally.
#
#   viewer    The browser smoke test (app/e2e, Playwright; docs/graph-view-plan.md
#             §13, 2026-10-22): the same seeded store as the contract job, the
#             bundled hub started on 3100, the viewer built and started on 3000,
#             and the Design Graph driven in Chromium: the seed drawn, a record
#             selected, a view reproduced from its URL, no console error.
#
#   client    Installs @armature/client and @armature/types the way another
#             repository does (packages/client/install-check/run.sh, 2026-10-25):
#             packed from this checkout, installed with pnpm outside the npm
#             workspace, then type-checked with a Next app's options and run under
#             Vitest, tsx and a Next build, the tools CoQui uses. Added after the
#             README's install failed for an outside consumer: the client depended
#             on @armature/types@0.1.0, which resolves only inside the workspace.
#
#   files     The suites that need no store (app/vitest.files.config.mts: the
#             file-backed store's modules, the workspace folder on disk, and the
#             desktop core's modules with its bundle run as a child over pipes)
#             on a Windows runner. ADR-0066's Verification asks that the write-then-rename
#             sequence and the lock be proven where rename semantics differ and
#             Defender's real-time scanning holds new files open; a folder inside a
#             synced directory (OneDrive) still needs a real machine. Added 2026-11-02.
#
#   images    Builds the hub's container image (docker/hub.Dockerfile) and checks
#             that it starts and answers GET /api/v1/discover, the one read that
#             needs no store; then builds the viewer's image (docker/viewer.Dockerfile)
#             and checks that it starts. What the hub answers over a socket is the
#             contract job's hub test; this job guards the images themselves,
#             including that the operator tools run inside the hub's image.
#
# Each job has a timeout, so a stalled install fails within minutes rather than
# after GitHub's six-hour default. Healthy runs take 20 to 95 seconds a job. On
# 2026-10-22, during npm's "Degraded Package Install and Publishing" incident, one
# run passed slowly (app 7 minutes, images 5, contract 11) and the next stalled in
# the contract job's `npm ci` until it was cancelled by hand. The limits let the
# slow run pass and stop the stalled one: 10 minutes for app and images, 15 for
# contract.
#
# The contract shards and the viewer restore node_modules (the workspace's and
# scripts/) from a cache keyed on both lockfiles, the runner's system and processor,
# and Node's major version, and run `npm ci` only on a miss, saving the result
# before anything builds or tests so the cache holds exactly what `npm ci` wrote.
# It saves 35 to 45 seconds a job. The app and files jobs keep a fresh `npm ci`,
# so every run still proves the lockfiles install from nothing on Linux and on
# Windows; the client job proves an outside consumer's install.
#
# A pull request's run is cancelled when a newer commit is pushed to it, since its
# result no longer describes the branch; a push to main is never cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Whether the change can affect the code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request's run checks out the merge of its head into the base: its
      # first parent is the base, so the diff against that parent is exactly the
      # change under test.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        name: List the changed files and look for code among them
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD) || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then
              files=$(git diff --name-only "$BEFORE" "$AFTER") || files=""
            fi
          fi
          if [ -z "$files" ]; then
            code=true
            echo "No list of changed files, so everything runs." >> "$GITHUB_STEP_SUMMARY"
          else
            # Documents, except the ones a test or a build reads.
            read_by_code='^docs/client-changes\.md$'
            found=$( { printf '%s\n' "$files" | grep -E "$read_by_code" || true
                       printf '%s\n' "$files" | grep -vE '^(docs/|schema/docs/|\.claude/)|\.md$' || true; } )
            if [ -n "$found" ]; then
              code=true
              { echo "Code changed, so everything runs:"; echo '```'; printf '%s\n' "$found"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              code=false
              { echo "Only documents changed, so the app job alone runs:"; echo '```'; printf '%s\n' "$files"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"


  app:
    name: Lint, type-check, generated-types drift check, context budgets and the bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:types
      - run: npm run check:context
      - run: npm run build:hub --workspace app
      - run: npm run build:operator --workspace app
      - run: npm run build:desktop --workspace app

  # The five jobs below run unless `changes` proved the change touches documents only;
  # `!cancelled()` keeps them running if `changes` itself failed, whose output is then empty.
  client:
    name: The client installed as another repository installs it
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: packages/client/install-check/run.sh

  contract:
    name: Contract suite against TerminusDB (shard ${{ matrix.shard }} of 3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      terminusdb:
        # The same image and tag docker/docker-compose.yml pins.
        image: terminusdb/terminusdb-server:v12.0.7
        ports:
          - 6363:6363
        env:
          TERMINUSDB_ADMIN_PASS: admin
          TERMINUSDB_SERVER_NAME: localhost
    env:
      # What app/.env.local holds locally; the scripts read the same variables.
      TERMINUS_URL: http://localhost:6363
      TERMINUS_USER: admin
      TERMINUS_PASS: admin
      TERMINUS_DB: armature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/package-lock.json
      - uses: actions/cache/restore@v4
        id: modules
        with:
          path: |
            node_modules
            app/node_modules
            scripts/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'scripts/package-lock.json') }}
      - name: Install the scripts' dependencies (the TerminusDB client)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: scripts
      - name: Install the workspace (the app and the packages)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache/save@v4
        if: steps.modules.outputs.cache-hit != 'true'
        with:
          path: |
            node_modules
            app/node_modules
            scripts/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      - name: Wait for TerminusDB
        run: node scripts/wait_for_store.js
      - name: Load the schema
        run: node scripts/load_schema.js
      - name: Seed the demonstration course
        run: node scripts/seed_data.js
      - name: Check the seed against every rule
        run: npm run operator --workspace app -- check
      - name: Run the contract suite, shard ${{ matrix.shard }} of 3
        # Through the workspace, so the flag reaches Vitest: the root's `npm test` is
        # itself an npm command, which would take `--shard` as one of its own options.
        run: npm test --workspace app -- --shard=${{ matrix.shard }}/3

  viewer:
    name: Viewer smoke test in a browser
    # The Design Graph and the other pages driven by Playwright (app/e2e,
    # docs/graph-view-plan.md §13) against the built viewer, the bundled hub
    # and the same seeded store the contract job uses.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      terminusdb:
        image: terminusdb/terminusdb-server:v12.0.7
        ports:
          - 6363:6363
        env:
          TERMINUSDB_ADMIN_PASS: admin
          TERMINUSDB_SERVER_NAME: localhost
    env:
      TERMINUS_URL: http://localhost:6363
      TERMINUS_USER: admin
      TERMINUS_PASS: admin
      TERMINUS_DB: armature
      ARMATURE_HUB_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/package-lock.json
      - uses: actions/cache/restore@v4
        id: modules
        with:
          path: |
            node_modules
            app/node_modules
            scripts/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json', 'scripts/package-lock.json') }}
      - name: Install the scripts' dependencies (the TerminusDB client)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: scripts
      - name: Install the workspace (the app and the packages)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - uses: actions/cache/save@v4
        if: steps.modules.outputs.cache-hit != 'true'
        with:
          path: |
            node_modules
            app/node_modules
            scripts/node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}
      # The browser binaries, cached on the lockfile (Playwright's version pins
      # the build). Without --with-deps: that flag apt-installs 26 MB of
      # libraries the ubuntu-latest image already carries, and on 2026-10-23
      # the mirror served them at 52 kB/s, nine minutes of a ten-minute job.
      # If Chromium ever fails to launch for a missing library, the step to add
      # is `npx playwright install-deps chromium`.
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browser
        if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: app
      - name: Wait for TerminusDB
        run: node scripts/wait_for_store.js
      - name: Load the schema
        run: node scripts/load_schema.js
      - name: Seed the demonstration course
        run: node scripts/seed_data.js
      - name: Bundle the hub
        run: npm run build:hub --workspace app
      - name: Build the viewer
        run: npm run build --workspace app
      - name: Run the smoke test
        run: npm run test:e2e --workspace app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  files:
    name: The file-backed store, the workspace folder and the desktop core on Windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:files --workspace app

  images:
    name: Hub and viewer container images
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the hub image
        run: docker build -f docker/hub.Dockerfile -t armature-hub .
      - name: Run alone, it refuses to listen beyond loopback under header (ADR-0067 decision 8)
        run: |
          if docker run --rm armature-hub > /tmp/refused.log 2>&1; then
            echo "the image started without ARMATURE_TRUST_NETWORK"; cat /tmp/refused.log; exit 1
          fi
          cat /tmp/refused.log; grep -q 'ARMATURE_TRUST_NETWORK=1' /tmp/refused.log
      - name: Start it and wait for GET /discover
        # As the compose file runs it: on a network declared the gate.
        run: |
          docker run -d --name hub -e ARMATURE_TRUST_NETWORK=1 -p 3100:3100 armature-hub
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/api/v1/discover > /tmp/discover.json; then
              echo "answered after ${i}s"; cat /tmp/discover.json; exit 0
            fi
            sleep 1
          done
          echo "the hub did not answer within 30s"; docker logs hub; exit 1
      - name: Show the log and stop
        if: always()
        run: docker logs hub; docker rm -f hub
      - name: Run the operator tools inside the hub image
        run: docker run --rm armature-hub node operator.mjs --help
      - name: Validate the Caddyfile under each resolver (the hub's site only under oidc)
        # The snippet the Caddyfile imports is chosen by ARMATURE_IDENTITY (docker/caddy/);
        # both must adapt, and under oidc the hub's site must carry the API host, not a catch-all,
        # and no `encode`: Caddy appends the encoding's name to a strong ETag when it compresses,
        # which broke If-Match and a workspace hub's push on the Droplet run of 2026-11-05.
        run: |
          for identity in header oidc; do
            docker run --rm -e ARMATURE_SITE=example.org -e ARMATURE_IDENTITY=$identity -e ARMATURE_API_HOST=api.example.org \
              -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/docker/caddy:/etc/caddy/profile:ro" -v "$PWD/docker/sites:/etc/caddy/sites:ro" \
              caddy:2.10.2-alpine caddy adapt --config /etc/caddy/Caddyfile > /tmp/caddy-$identity.json
          done
          grep -q '"hub:3100"' /tmp/caddy-oidc.json && ! grep -q '"hub:3100"' /tmp/caddy-header.json
          grep -q '"api.example.org"' /tmp/caddy-oidc.json
          jq -e '[.apps.http.servers[].routes[] | select(.match[]?.host[]? == "api.example.org") | .. | objects | select(.handler? == "encode")] | length == 0' /tmp/caddy-oidc.json
      - name: The compose file derives the hub's public address, and a set one wins
        run: |
          derived() { env "$@" docker compose -f docker/docker-compose.yml --profile hub config --format json | jq -r .services.hub.environment.ARMATURE_PUBLIC_URL; }
          test "$(derived ARMATURE_SITE=example.org)" = https://api.example.org
          test "$(derived ARMATURE_API_HOST=hub.example.org ARMATURE_API_SCHEME=http)" = http://hub.example.org
          test "$(derived ARMATURE_PUBLIC_URL=https://elsewhere.example.org)" = https://elsewhere.example.org
      - name: Build the viewer image
        run: docker build -f docker/viewer.Dockerfile -t armature-viewer .
      - name: Start it and wait for a page
        # With no hub to read, a page answers 500; the check is that the server
        # is up and routing, which any status below 500 or a 500 both show.
        run: |
          docker run -d --name viewer -p 3000:3000 armature-viewer
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != "000" ]; then echo "answered $code after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "the viewer did not answer within 30s"; docker logs viewer; exit 1
      - name: Show the viewer log and stop
        if: always()
        run: docker logs viewer; docker rm -f viewer
