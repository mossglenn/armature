# The desktop program's shell (desktop/; ADR-0069; docs/desktop-program-plan.md §10 and §12)
#
# On a pull request or a push to main that touches the shell or the core it carries: the pages
# type-check and pass their browser tests against the fake core (e2e/), the Rust side passes
# clippy with warnings as errors and its unit tests, and a debug bundle builds on Ubuntu (a .deb,
# kept for a week for a Linux rehearsal). Run by hand (workflow_dispatch), it builds instead a
# Windows debug installer for a rehearsal on a real machine (§12; decided 2026-11-08), kept for a
# week; Windows is not built on every pull request, since the release workflow (the plan's step 5)
# builds macOS, Windows and Linux on their own runners. The core's own suites run in ci.yml: its
# modules in the contract and files jobs, its bundle in the app job.
#
# desktop/ is installed on its own, with its own lockfile (decided 2026-11-07), so this is the only
# job that installs it; the root's workspace is installed too, since the core is bundled there.

name: Desktop

# The job's token reads only, and the third-party actions are pinned to the commits the release
# workflow pins (the 2026-11-09 review's S11).
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'app/desktop.ts'
      - 'app/lib/desktop/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/desktop.ts'
      - 'app/lib/desktop/**'
      - '.github/workflows/desktop.yml'
  # gh workflow run desktop.yml --ref <branch>: the Windows installer only.
  workflow_dispatch:

jobs:
  shell:
    name: The desktop shell's checks and debug bundle on Ubuntu
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      # Tauri's Linux prerequisites (WebKitGTK 4.1, the tray's indicator, SVG), and D-Bus for the
      # keychain's Secret Service backend (the keyring crate).
      - name: Install the system's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-27
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      # Node for the sidecar, fetched by prepare.mjs and checked against the checksum pinned in it;
      # kept between runs until the script (which names the version) changes.
      - uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: desktop-node-${{ runner.os }}-${{ hashFiles('desktop/scripts/prepare.mjs') }}
      - name: Install the root's workspace (the core is bundled there)
        run: npm ci
      - name: Install the shell's packages
        run: npm ci
        working-directory: desktop
      - name: Type-check the pages
        run: npm run typecheck
        working-directory: desktop
      - name: Install the browser for the page tests
        run: npx playwright install --with-deps chromium
        working-directory: desktop
      - name: The pages in Chromium against the fake core
        run: npm run test:e2e
        working-directory: desktop
      - name: Prepare the sidecar and the core's bundle
        run: npm run sidecar
        working-directory: desktop
      - name: Clippy, warnings as errors
        run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: The shell's unit tests
        run: cargo test
        working-directory: desktop/src-tauri
      - name: Build a debug bundle
        run: npm run tauri build -- --debug --bundles deb
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: armature-desktop-debug-deb
          path: desktop/src-tauri/target/debug/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: error

  windows:
    name: A Windows debug installer for a rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-27
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - uses: actions/cache@v4
        with:
          path: desktop/.cache
          key: desktop-node-${{ runner.os }}-${{ hashFiles('desktop/scripts/prepare.mjs') }}
      - name: Install the root's workspace (the core is bundled there)
        run: npm ci
      - name: Install the shell's packages
        run: npm ci
        working-directory: desktop
      # The build's beforeBuildCommand prepares the sidecar (Node's win-x64 zip, its pinned checksum checked)
      # and the core's bundle, then the pages. NSIS's installer is per user, so the PC needs no
      # administrator; WebView2 ships with Windows 10 and 11. A debug build keeps its console
      # window (main.rs sets the windows subsystem for release only), which shows the shell's log.
      - name: Build a debug installer
        run: npm run tauri build -- --debug --bundles nsis
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: armature-desktop-debug-windows
          path: desktop/src-tauri/target/debug/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
