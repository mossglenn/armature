[package]
name = "armature-desktop"
version = "0.1.0"
description = "The Armature desktop program's shell: a Tauri 2 program over the core, the workspace hub's host (ADR-0069)"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[lib]
name = "armature_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
