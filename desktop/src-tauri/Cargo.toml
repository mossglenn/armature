[package]
name = "armature-desktop"
version = "0.1.1"
description = "The Armature desktop program's shell: a Tauri 2 program over the core, the workspace hub's host (ADR-0069)"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[lib]
name = "armature_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
# 3.6, not 4: the plan's API (Entry::new(service, user)); 4 split the stores into separate crates.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dunce = "1"
tokio = { version = "1", features = ["sync", "time", "signal", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
# The updater's watchdog test runs on virtual time.
tokio = { version = "1", features = ["test-util", "rt", "macros"] }
