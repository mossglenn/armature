# Armature's containers (see docs/deployment.md for the whole picture).
#
#   docker compose up -d                          the store only: local development, with
#                                                 the hub run on the machine (npm run start:hub)
#   docker compose --profile hub up -d --build    an instance on this machine: the store, the
#                                                 hub and the viewer, three containers on one
#                                                 private network, all on loopback
#   docker compose --profile public up -d --build a hosted instance: the same three with Caddy
#                                                 in front, the only container a visitor reaches
#   docker compose run --rm operator node <script> one of scripts/ (load_schema.js, seed_data.js)
#                                                 against the store, from a Node container
#   docker compose --profile workspace up -d --build
#                                                 a workspace hub (ADR-0065) on this machine, on
#                                                 loopback port 3101, its workspaces in a folder
#                                                 (ADR-0066), cloned from ARMATURE_REMOTE_URL;
#                                                 with `--profile hub` too, from the hub beside it
#   docker compose --profile rehearsal-oidc up -d an identity provider (Keycloak) for a rehearsal
#                                                 of the `oidc` resolver, on loopback port 8080;
#                                                 never a deployment's
#
# Two private networks (ADR-0067 decision 8, note of 2026-10-30). The front one is
# named `armature`, whatever the checkout's directory, so a client deployed beside the
# instance (CoQui for a demonstration) joins it from its own compose file as an
# external network and calls the hub as http://hub:3100; its public site is a file in
# docker/sites/, which Caddy imports (docs/deployment.md, "A client on the same
# server"). Whatever joins it can write as anyone, but cannot reach the store: the
# store network, `armature-store`, is joined only by TerminusDB, the hub and the
# operator service; a workspace hub has no store and never joins it. A hub here under
# the `header` resolver runs on a network it trusts, so each says so
# (ARMATURE_TRUST_NETWORK=1); the image alone refuses to listen beyond loopback
# under `header`. Under `oidc` the same hub is published through Caddy at
# ARMATURE_API_HOST, every request verified (docs/deployment.md, "An instance under oidc").
#
# What the machine publishes, and to whom:
#   caddy   80 and 443 everywhere     the public face (profile `public`): HTTPS for
#                                     ARMATURE_SITE, proxied to the viewer on the network;
#                                     under `oidc` also ARMATURE_API_HOST, proxied to the
#                                     hub, every request carrying a verified token
#   viewer  3000 on loopback only     its pages only read; ARMATURE_VIEWER_BIND widens it
#   hub     3100 on loopback only     for operators on the machine (curl /discover, a
#                                     client run locally); nothing beyond the machine
#                                     under `header`, which trusts the caller (ADR-0032),
#                                     and only through Caddy under `oidc`; ARMATURE_HUB_BIND
#                                     widens it
#   store   6363 on loopback only     for the operator scripts (load_schema.js, seed_data.js,
#                                     a re-import), which need the store's password
#
# The schema and the data are loaded from the machine either way. The hub needs no
# running store to start: every request opens its own connection, and a store that is
# not up yet answers as a 500 until it is. On any machine that is not a laptop, put
# TERMINUSDB_ADMIN_PASS and ARMATURE_SITE in docker/.env (mode 600; Git ignores it),
# which Compose reads on every command here; `admin` is the development default only,
# and the `public` profile refuses to start Caddy while the password is unset or
# `admin` (the public-guard service). Every service restarts with Docker
# (`unless-stopped`), so an instance survives a reboot.
services:
  terminusdb:
    image: terminusdb/terminusdb-server:v12.0.7
    restart: unless-stopped
    ports:
      - "${TERMINUSDB_BIND:-127.0.0.1}:6363:6363"
    volumes:
      - terminusdb-data:/app/terminusdb/storage
    environment:
      - TERMINUSDB_ADMIN_PASS=${TERMINUSDB_ADMIN_PASS:-admin}
      - TERMINUSDB_SERVER_NAME=${TERMINUSDB_SERVER_NAME:-localhost}
    networks: [store]

  hub:
    build:
      context: ..
      dockerfile: docker/hub.Dockerfile
    profiles: [hub, public]
    restart: unless-stopped
    ports:
      - "${ARMATURE_HUB_BIND:-127.0.0.1}:${ARMATURE_HUB_PORT:-3100}:3100"
    environment:
      # The store by its service name on the private network; the same
      # variables app/.env.local holds for a hub run on the machine.
      - TERMINUS_URL=http://terminusdb:6363
      - TERMINUS_USER=admin
      - TERMINUS_PASS=${TERMINUSDB_ADMIN_PASS:-admin}
      - TERMINUS_DB=${TERMINUS_DB:-armature}
      # The identity resolver (ADR-0032): `header` trusts the caller, which is
      # why the hub's port stays on loopback (see the note above); `oidc`
      # (ADR-0067 decision 1, since 2026-11-05) verifies a bearer token on every
      # request against the issuer named here, and only then is the hub
      # published, under the `public` profile at ARMATURE_API_HOST.
      - ARMATURE_IDENTITY=${ARMATURE_IDENTITY:-header}
      - ARMATURE_OIDC_ISSUER=${ARMATURE_OIDC_ISSUER:-}
      - ARMATURE_OIDC_AUDIENCE=${ARMATURE_OIDC_AUDIENCE:-}
      - ARMATURE_OIDC_ADMIT=${ARMATURE_OIDC_ADMIT:-}
      - ARMATURE_OIDC_CLIENT_ID=${ARMATURE_OIDC_CLIENT_ID:-}
      - ARMATURE_OIDC_JWKS_URL=${ARMATURE_OIDC_JWKS_URL:-}
      # The client ids that are services (ADR-0067 decision 4, note of
      # 2026-11-12): a token is a service's only when its client is listed and
      # it carries no name. The viewer's own client by default, so an instance
      # with a viewer needs no line for it; a relay's client is added by name,
      # and then the viewer's is written out beside it.
      - ARMATURE_OIDC_SERVICES=${ARMATURE_OIDC_SERVICES:-${ARMATURE_HUB_CLIENT_ID:-}}
      # `1` for a rehearsal that is never a deployment: the hub then takes plain
      # http for its issuer, the issuer's keys and its public address on a host
      # that is not loopback, and the guard below lets ARMATURE_API_SCHEME=http by.
      - ARMATURE_REHEARSAL=${ARMATURE_REHEARSAL:-}
      # The connection profile, `instance` in GET /discover: the name a person
      # confirms before connecting (the host name when unset), and where a client
      # beyond this server reaches the hub, by default what Caddy publishes under
      # `oidc`. The hub reads the address only under `oidc`, since a hub under
      # `header` has no public name, so this file need not know the resolver.
      - ARMATURE_INSTANCE_NAME=${ARMATURE_INSTANCE_NAME:-}
      - ARMATURE_PUBLIC_URL=${ARMATURE_PUBLIC_URL:-${ARMATURE_API_SCHEME:-https}://${ARMATURE_API_HOST:-api.${ARMATURE_SITE:-localhost}}}
      # The loopback boundary (ADR-0067 decision 7): besides loopback, the hub
      # answers only the host names listed here, so a web page that points its
      # own domain at this machine is refused. `hub` is the name the viewer and a
      # client beside the instance call it by; the API host is the name Caddy
      # proxies it at under `oidc` (harmless under `header`, where nothing
      # proxies it); add a name if anything else calls the hub by one. A web
      # page that calls the hub directly needs its origin in
      # ARMATURE_ALLOWED_ORIGINS; none does by default.
      - ARMATURE_ALLOWED_HOSTS=hub,${ARMATURE_API_HOST:-api.${ARMATURE_SITE:-localhost}},${ARMATURE_ALLOWED_HOSTS:-}
      - ARMATURE_ALLOWED_ORIGINS=${ARMATURE_ALLOWED_ORIGINS:-}
      # Set it so pseudonymous exports name the same person the same way every time (ADR-0031).
      - ARMATURE_EXPORT_KEY=${ARMATURE_EXPORT_KEY:-}
      # The hub listens on 0.0.0.0 inside its container; under `header` that is
      # allowed only on a network declared the gate (ADR-0067 decision 8).
      - ARMATURE_TRUST_NETWORK=1
    networks: [default, store]
    depends_on:
      - terminusdb

  viewer:
    build:
      context: ..
      dockerfile: docker/viewer.Dockerfile
    profiles: [hub, public]
    restart: unless-stopped
    ports:
      - "${ARMATURE_VIEWER_BIND:-127.0.0.1}:${ARMATURE_VIEWER_PORT:-3000}:3000"
    environment:
      # The hub by its service name: the pages fetch from it inside the network.
      - ARMATURE_HUB_URL=http://hub:3100
      # Where a reader's browser could reach the hub, for the raw-data links in
      # the page footers; unset, the links are omitted and the hub stays private.
      # Under `oidc` with the hub published, https://<ARMATURE_API_HOST>.
      - ARMATURE_HUB_PUBLIC_URL=${ARMATURE_HUB_PUBLIC_URL:-}
      # The viewer's own credential for a hub under `oidc` (ADR-0067 decision 4;
      # app/lib/viewerToken.ts): a token as issued, or a client id and secret
      # with which it asks the issuer for one; the endpoint when the issuer's
      # public name is not reachable from here (a rehearsal). Unset under `header`.
      - ARMATURE_HUB_TOKEN=${ARMATURE_HUB_TOKEN:-}
      - ARMATURE_HUB_CLIENT_ID=${ARMATURE_HUB_CLIENT_ID:-}
      - ARMATURE_HUB_CLIENT_SECRET=${ARMATURE_HUB_CLIENT_SECRET:-}
      - ARMATURE_HUB_TOKEN_ENDPOINT=${ARMATURE_HUB_TOKEN_ENDPOINT:-}
    depends_on:
      - hub

  caddy:
    # The front door of a hosted instance: TLS with a certificate it obtains and
    # renews itself for ARMATURE_SITE (a domain whose DNS points at this machine),
    # proxying to the viewer by its service name. `:80` serves plain HTTP on any
    # address, for a rehearsal without a domain. Under `oidc` it also proxies the
    # hub at ARMATURE_API_HOST (`api.<site>` by default; ARMATURE_API_SCHEME `http`
    # for a rehearsal), the snippet in docker/caddy/ chosen by ARMATURE_IDENTITY
    # (ADR-0067 decision 7, note; since 2026-11-05).
    image: caddy:2.10.2-alpine
    profiles: [public]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The hub's site under `oidc`, nothing under `header` (docker/caddy/).
      - ./caddy:/etc/caddy/profile:ro
      # Other sites on this server, one file each (docker/sites/README.md).
      - ./sites:/etc/caddy/sites:ro
      # Certificates and the account key; kept so a restart does not ask again.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - ARMATURE_SITE=${ARMATURE_SITE:-localhost}
      - ARMATURE_IDENTITY=${ARMATURE_IDENTITY:-header}
      - ARMATURE_API_HOST=${ARMATURE_API_HOST:-api.${ARMATURE_SITE:-localhost}}
      - ARMATURE_API_SCHEME=${ARMATURE_API_SCHEME:-https}
    depends_on:
      viewer:
        condition: service_started
      public-guard:
        condition: service_completed_successfully

  public-guard:
    # Refuses the public profile a default password (ADR-0067 decision 8, note of
    # 2026-10-30; review H8): Caddy, the only container a visitor reaches, starts
    # only after this exits 0, so `up` fails, naming the variable, while
    # TERMINUSDB_ADMIN_PASS is unset or `admin`. A check in the file itself
    # (`${VAR:?}`) cannot do this: Compose evaluates it for every profile.
    # Since 2026-11-05 it also refuses a resolver it does not know, and `oidc`
    # without its issuer and audience (the hub would not start) or without an
    # API host (Caddy would proxy the hub for any name); and the hub's site under
    # `header` is never there, whatever ARMATURE_API_HOST says (the Caddyfile).
    # Since 2026-11-12 it refuses `oidc` with ARMATURE_API_SCHEME=http, which
    # would publish the hub for bearer tokens in the clear, unless
    # ARMATURE_REHEARSAL=1 says this is a rehearsal (the hub refuses the same).
    image: caddy:2.10.2-alpine
    profiles: [public]
    network_mode: none
    environment:
      - PASS=${TERMINUSDB_ADMIN_PASS:-}
      - IDENTITY=${ARMATURE_IDENTITY:-header}
      - ISSUER=${ARMATURE_OIDC_ISSUER:-}
      - AUDIENCE=${ARMATURE_OIDC_AUDIENCE:-}
      - API_HOST=${ARMATURE_API_HOST:-api.${ARMATURE_SITE:-localhost}}
      - API_SCHEME=${ARMATURE_API_SCHEME:-https}
      - REHEARSAL=${ARMATURE_REHEARSAL:-}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$PASS" ] || [ "$$PASS" = admin ]; then
          echo 'The public profile needs TERMINUSDB_ADMIN_PASS in docker/.env, set to something other than admin' >&2
          exit 1
        fi
        case "$$IDENTITY" in
          header) ;;
          oidc)
            if [ -z "$$ISSUER" ] || [ -z "$$AUDIENCE" ]; then
              echo 'ARMATURE_IDENTITY=oidc needs ARMATURE_OIDC_ISSUER and ARMATURE_OIDC_AUDIENCE in docker/.env' >&2
              exit 1
            fi
            case "$$API_HOST" in
              ''|*:*|*/*)
                echo "ARMATURE_IDENTITY=oidc publishes the hub at ARMATURE_API_HOST, a bare host name; it is '$$API_HOST' (set it, or set ARMATURE_SITE to a domain)" >&2
                exit 1
                ;;
            esac
            if [ "$$API_SCHEME" != https ] && [ "$$REHEARSAL" != 1 ]; then
              echo "ARMATURE_IDENTITY=oidc publishes the hub for bearer tokens, so ARMATURE_API_SCHEME is https; it is '$$API_SCHEME' (ARMATURE_REHEARSAL=1 allows plain http for a rehearsal, never a deployment)" >&2
              exit 1
            fi
            ;;
          *)
            echo "ARMATURE_IDENTITY=$$IDENTITY names no resolver (header, oidc)" >&2
            exit 1
            ;;
        esac

  operator:
    # The operator scripts (scripts/: wait_for_store, load_schema, seed_data), run in
    # a throwaway Node container on the private network, so a server needs Docker and
    # nothing else and the store keeps its loopback binding:
    #   docker compose run --rm operator node load_schema.js
    # The repository is mounted read-only; the scripts' dependencies live in a volume,
    # installed when the lock file changes (operator-entrypoint.sh), so nothing is
    # written into the checkout.
    image: node:22-alpine
    profiles: [operator]
    volumes:
      - ..:/repo:ro
      - operator-modules:/deps
    environment:
      - TERMINUS_URL=http://terminusdb:6363
      - TERMINUS_USER=admin
      - TERMINUS_PASS=${TERMINUSDB_ADMIN_PASS:-admin}
      - TERMINUS_DB=${TERMINUS_DB:-armature}
    entrypoint: ["sh", "/repo/docker/operator-entrypoint.sh"]
    networks: [store]
    depends_on:
      - terminusdb

  workspace:
    # A workspace hub (ADR-0065; docs/workspace-hub-plan.md §10): the same image in
    # workspace mode, for developers and researchers. Its workspaces live in the
    # file-backed store of ADR-0066, a folder in the volume `workspace-folder` (their
    # records beside their commits), the one local store since decision 4 of that ADR
    # (2026-11-02), so it needs no store server and stays off the store network. It
    # clones from ARMATURE_REMOTE_URL, the hub beside it by default (`--profile hub
    # --profile workspace`); a remote elsewhere is named in docker/.env, and must
    # answer to the name used (its ARMATURE_ALLOWED_HOSTS). Published on loopback
    # only, like the hub.
    build:
      context: ..
      dockerfile: docker/hub.Dockerfile
    profiles: [workspace]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ARMATURE_WORKSPACE_PORT:-3101}:3100"
    volumes:
      - workspace-folder:/workspaces
    environment:
      - ARMATURE_IDENTITY=header
      - ARMATURE_ROLE=workspace
      - ARMATURE_REMOTE_URL=${ARMATURE_REMOTE_URL:-http://hub:3100}
      - ARMATURE_WORKSPACE_DIR=/workspaces
      - ARMATURE_TRUST_NETWORK=1
      # The per-launch secret every write carries as Armature-Local-Token (ADR-0065
      # decision 7): set in docker/.env, or left empty, when the hub draws one at each
      # start and prints it in its log (`docker compose logs workspace`). The profile has
      # no desktop program in front of it, so push, bring in and deliver are served as
      # routes here; a workspace hub run without this setting refuses them.
      - ARMATURE_LOCAL_TOKEN=${ARMATURE_LOCAL_TOKEN:-}
      - ARMATURE_WORKSPACE_ACTIONS=routes
      # The owner's bearer token for a remote under `oidc` (ADR-0067 decision 2,
      # note; since 2026-11-05), sent on every call to the remote in place of the
      # owner's identifier; unset for a remote under `header`, such as the hub beside it.
      - ARMATURE_REMOTE_TOKEN=${ARMATURE_REMOTE_TOKEN:-}
    networks: [default]

  keycloak:
    # An identity provider for a rehearsal of `oidc` (ADR-0067, open question 2:
    # the ADR names no provider; Keycloak in a profile that ships nowhere by
    # default, decided 2026-11-05), with the realm in docker/rehearsal/: two
    # clients, `armature-desktop` for people (PKCE with `offline_access`, and
    # password sign-in for a rehearsal's curl) and `armature-viewer` (a service, the client credentials
    # grant), both with the hub as audience; two people, designer and reviewer,
    # whose passwords are their names. KEYCLOAK_HOSTNAME is the issuer's base:
    # tokens say `<it>/realms/armature`, so the hub's ARMATURE_OIDC_ISSUER names
    # that, and reaches the keys by the service name instead
    # (ARMATURE_OIDC_JWKS_URL), as the viewer reaches the token endpoint
    # (ARMATURE_HUB_TOKEN_ENDPOINT); docs/deployment.md, "A hosted instance",
    # has the settings. Development mode, in memory, on loopback port 8080:
    # a rehearsal's provider, never a deployment's.
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [rehearsal-oidc]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./rehearsal/keycloak-realm.json:/opt/keycloak/data/import/armature-realm.json:ro
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASS:-admin}
      - KC_HOSTNAME=${KEYCLOAK_HOSTNAME:-http://localhost:8080}
      - KC_HTTP_ENABLED=true
    networks: [default]

networks:
  # The front network: the hubs, the viewer, Caddy, and any client beside the instance.
  default:
    name: armature
  # The store network: TerminusDB, the hubs and the operator; nothing a visitor or a client reaches.
  store:
    name: armature-store

volumes:
  terminusdb-data:
  workspace-folder:
  caddy-data:
  caddy-config:
  operator-modules:
